# Porta onde o servidor gRPC vai escutar no Kubernetes
grpc.server.port=50051

# Ativa o Project Loom (Virtual Threads) globalmente para o Spring e para o gRPC Server
spring.threads.virtual.enabled=true

# Configuração do servidor gRPC para melhorar performance com múltiplas conexões
# Keep-alive para detectar conexões inativas e manter vivas conexões HTTP/2
grpc.server.keep-alive-time=60s
grpc.server.keep-alive-timeout=20s
grpc.server.permit-keep-alive-without-calls=true

# Max concurrent streams por conexão HTTP/2 (aumentar para suportar mais multiplexing)
grpc.server.max-concurrent-streams=1000

# Max inbound message size (padrão 4MB, aumentar se necessário)
grpc.server.max-inbound-message-size=10485760

# Logging para diagnóstico
logging.level.io.grpc=DEBUG
logging.level.io.grpc.netty=WARN

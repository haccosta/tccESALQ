server.port=8080

# 1. ATIVAÇÃO DO PROJECT LOOM
spring.threads.virtual.enabled=true

# 2. ISOLAMENTO DO MÓDULO CLIENTE
# Desabilita o servidor gRPC neste módulo cliente para evitar que o bean de servidor
# seja iniciado (este módulo deve apenas atuar como cliente). Isso evita que o
# NettyServer tente usar a variável de ambiente `GRPC_SERVER_ADDRESS` como endereço
# de bind do servidor (causando o erro: not an IP string literal).
grpc.server.enabled=false

# 3. ENDEREÇAMENTO HEADLESS
grpc.client.meu-servico-grpc.address=${GRPC_CLIENT_MEU_SERVICO_GRPC_ADDRESS:dns:///localhost:50051}
grpc.client.meu-servico-grpc.negotiation-type=plaintext

# 4. POLÍTICA DE BALANCEAMENTO CORRIGIDA
# Mudança estrutural: O fallback padrão agora é 'least_request'.
# Valores válidos aceitos pelo gRPC-Java: "round_robin", "pick_first" ou "least_request".
grpc.client.meu-servico-grpc.default-load-balancing-policy=${LB_POLICY:least_request}

# 5. GERENCIAMENTO DE THREADS DO CANAL (Essencial para Virtual Threads)
# Força o gRPC a usar seu próprio gerenciador de transporte assíncrono isolado.
# Isso impede que as Virtual Threads do Tomcat causem condições de corrida na contagem de conexões do least_request.
grpc.client.meu-servico-grpc.executor=none

# 6. CONFIGURAÇÃO DE PERFORMANCE E REUSO HTTP/2 (Transpostas do seu código antigo)
grpc.client.meu-servico-grpc.keep-alive-time=60s
grpc.client.meu-servico-grpc.keep-alive-timeout=20s
grpc.client.meu-servico-grpc.keep-alive-without-calls=true

# Ajusta a janela de controle de fluxo de dados de rede para alta concorrência (equivalente a 1 << 20)
grpc.client.meu-servico-grpc.flow-control-window=1048576
grpc.client.meu-servico-grpc.max-inbound-message-size=10485760

# 7. DIAGNÓSTICO E LOGS
logging.level.br.usp.projetotcc.client=DEBUG
logging.level.io.grpc=WARN
